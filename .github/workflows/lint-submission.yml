name: Lint submission

# `pull_request`, never `pull_request_target`: a submission is untrusted content from a
# fork, and this job reads it. `pull_request` runs it with a read-only token and no
# secrets, which is what makes running a stranger's manifest through a validator safe.
on:
  pull_request:
    paths:
      - 'flows/**'

permissions:
  contents: read

env:
  # The app version this registry lists for. `master` until Cubric Studio 2.0 tags —
  # no released tag carries scripts/lint-flow-package.mjs yet. Flip this to v2.0.0 on
  # release day; it is the only line that has to change.
  STUDIO_REF: master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Cubric Studio at ${{ env.STUDIO_REF }}
        uses: actions/checkout@v4
        with:
          repository: MadPonyInteractive/Cubric-Studio
          ref: ${{ env.STUDIO_REF }}
          path: .studio

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Neither repo is installed. The linter runs on node builtins plus relative app
      # files, and this repo has no dependencies at all — so there is no `npm ci` here
      # on purpose, not by omission.

      - name: The entry checker's own tests
        run: node --test scripts/check-entry.test.mjs

      - name: What this PR changed
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          entries=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'flows/*.json' | tr '\n' ' ')
          packages=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'flows/*/flow.json' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Entries:  ${entries:-none}"
          echo "Packages: ${packages:-none}"

      - name: Catalogue entries
        run: node scripts/check-entry.mjs ${{ steps.changed.outputs.entries }}

      # The one conditional the two lanes need. A free-lane PR carries its package and it
      # is linted here; a paid-lane PR carries only metadata, and there is nothing to lint
      # because the package is reviewed privately.
      - name: Flow package (free lane)
        if: steps.changed.outputs.packages != ''
        run: node .studio/scripts/lint-flow-package.mjs ${{ steps.changed.outputs.packages }}

      - name: No package in this PR
        if: steps.changed.outputs.packages == ''
        run: |
          echo "Metadata only — nothing to lint here."
          echo "Paid lane: the package is reviewed privately and its sha256 is the public record."

      - name: What was NOT checked
        if: always()
        run: |
          echo "Node classes were NOT checked: a runner has no ComfyUI."
          echo "Node-pack drift was NOT checked, for the same reason."
          echo "Both are the author's local lint (COMFY_URL / COMFY_PATH) — see the README."
